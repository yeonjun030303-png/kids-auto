name: daily-video
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "short or long"
        default: "short"
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum
      - run: pip install -r requirements.txt
      - run: python make_video.py
        env:
          MODE: ${{ github.event.inputs.mode || 'short' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: out/final.mp4
          retention-days: 7
          if-no-files-found: ignore
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json || true
          git commit -m "update history" || echo "nothing"
          git push || true